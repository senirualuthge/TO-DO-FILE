<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do App</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<main class="app">
  <h1>To-Do List</h1>

  <form id="todo-form" class="todo-form">
    <label for="todo-input" class="visually-hidden">New task</label>
    <input id="todo-input" type="text" placeholder="Add a new task" autocomplete="off" required>
    <button type="submit">Add task</button>
  </form>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button type="button" class="filter active" data-filter="all" aria-pressed="true">All</button>
    <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
    <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button>
  </div>

  <ul id="todo-list" class="todo-list"></ul>

  <p id="empty-message" class="empty-message" hidden></p>

  <div class="footer">
    <span id="count">0 tasks left</span>
    <button type="button" id="clear-completed" class="link-button">Clear completed</button>
  </div>
</main>

</body>
</html>
